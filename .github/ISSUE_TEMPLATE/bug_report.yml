name: Bug report
description: Something crashes, looks wrong, or behaves differently from the original game.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Don't attach or link game files or disc images.** Screenshots, short clips and logs are welcome.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what the original game does instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new game
        2. Play mission 1 until ...
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game?
      placeholder: Mission 1, after the first cutscene / Versus menu / title screen
  - type: input
    id: commit
    attributes:
      label: Commit or release
      description: Run `git rev-parse --short HEAD`, or give the release name.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Game version
      options:
        - USA (GF7E01)
        - Europe (GF7P01)
        - Japan (GF7J01)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and GPU
      placeholder: Windows 11, RTX 4070, driver 566.36
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste the console output or attach a log file. Drag screenshots here.
      render: text
  - type: checkboxes
    id: legal
    attributes:
      label: Checklist
      options:
        - label: I haven't attached or linked any game files or disc images.
          required: true
        - label: I searched existing issues and this isn't a duplicate.
          required: true
