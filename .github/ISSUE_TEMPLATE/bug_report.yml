name: Bug report
description: Something crashes, looks wrong, or behaves differently from the original game.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Screenshots, short clips and logs are welcome.

        **Never attach or link game files.** That includes disc images, anything from `build/`, and anything from `saves/`: recordings, routes, the memory card (`memcard_a.raw`) and frame dumps all hold game data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what the original game does instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new game
        2. Play mission 1 until ...
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game?
      placeholder: Mission 1, after the first cutscene / Versus menu / title screen
  - type: textarea
    id: when
    attributes:
      label: When in the run?
      description: |
        If your build has the mark-this-moment key, press it when the bug happens and paste the marker times the game prints. Otherwise, say roughly how many minutes into the run it happened.
      placeholder: "Marked at 12:41 and 12:58"
  - type: input
    id: commit
    attributes:
      label: Commit or release
      description: Run `git rev-parse --short HEAD`, or give the release name.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: settings.txt
      description: Paste your `settings.txt` (the in-game menu writes it beside the `saves/` folder), or say you haven't changed any settings. Add any command-line options you used, such as `--scale=4`.
      render: text
  - type: dropdown
    id: version
    attributes:
      label: Game version
      options:
        - USA (GF7E01)
        - Europe (GF7P01)
        - Japan (GF7J01)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and GPU
      placeholder: Windows 11, RTX 4070, driver 566.36
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste the console output in a code block, or attach a log file. Drag screenshots here.
  - type: checkboxes
    id: legal
    attributes:
      label: Checklist
      options:
        - label: I haven't attached or linked any game files, disc images, recordings, memory cards or frame dumps.
          required: true
        - label: I searched existing issues and this isn't a duplicate.
          required: true
